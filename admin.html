<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Διαχειριστικό — Μπουγάτσα Ζήσης</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-mark">ΜΖ</div>
    <h1>Διαχειριστικό</h1>
    <p class="sub">Μπουγάτσα Ζήσης — Σέρρες</p>
    <div id="login-error"></div>
    <form id="login-form">
      <div class="field">
        <label for="username">Όνομα χρήστη</label>
        <input type="text" id="username" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Κωδικός</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-primary" id="login-btn">Είσοδος</button>
    </form>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <div class="topbar">
    <div class="brand">
      <div class="mark">ΜΖ</div>
      <h1>Διαχειριστικό — Μπουγάτσα Ζήσης</h1>
    </div>
    <div class="topbar-right">
      <span class="who" id="who-label"></span>
      <button class="btn-ghost" id="logout-btn">Αποσύνδεση</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-view="orders">Παραγγελίες</button>
    <button class="tab" data-view="products">Προϊόντα</button>
    <button class="tab" id="tab-users" data-view="users">Χρήστες</button>
  </div>

  <main>
    <!-- ORDERS -->
    <section class="view active" id="view-orders">
      <div class="toolbar">
        <h2>Παραγγελίες</h2>
        <div class="filter-row" id="status-filters"></div>
      </div>
      <div class="order-list" id="order-list"></div>
    </section>

    <!-- PRODUCTS -->
    <section class="view" id="view-products">
      <div class="toolbar"><h2>Προϊόντα</h2></div>
      <table>
        <thead><tr><th>Κατηγορία</th><th>Προϊόν</th><th>Τιμή (€)</th><th>Διαθεσιμότητα</th><th></th></tr></thead>
        <tbody id="product-rows"></tbody>
      </table>
    </section>

    <!-- USERS -->
    <section class="view" id="view-users">
      <div class="toolbar">
        <h2>Χρήστες</h2>
        <button class="btn-small" id="new-user-btn">+ Νέος χρήστης</button>
      </div>
      <table>
        <thead><tr><th>Όνομα χρήστη</th><th>Ρόλος</th><th>Κατάσταση</th><th></th></tr></thead>
        <tbody id="user-rows"></tbody>
      </table>
    </section>
  </main>
</div>

<!-- New user modal -->
<div class="modal-overlay" id="user-modal">
  <div class="modal">
    <h3>Νέος χρήστης</h3>
    <div class="field">
      <label>Όνομα χρήστη</label>
      <input type="text" id="new-username">
    </div>
    <div class="field">
      <label>Κωδικός</label>
      <input type="password" id="new-password">
    </div>
    <div class="field">
      <label>Ρόλος</label>
      <select id="new-role">
        <option value="staff">Προσωπικό</option>
        <option value="admin">Διαχειριστής</option>
      </select>
    </div>
    <div id="user-modal-error" style="color:var(--red); font-size:13px; display:none; margin-bottom:8px;"></div>
    <div class="modal-actions">
      <button class="btn-cancel" id="user-modal-cancel">Άκυρο</button>
      <button class="btn-small" id="user-modal-save">Δημιουργία</button>
    </div>
  </div>
</div>

<!-- Change password modal -->
<div class="modal-overlay" id="password-modal">
  <div class="modal">
    <h3>Αλλαγή κωδικού</h3>
    <p style="font-size:13px;color:var(--ink-soft);margin:-8px 0 14px;">Χρήστης: <strong id="password-modal-username"></strong></p>
    <div class="field">
      <label>Νέος κωδικός</label>
      <input type="password" id="password-modal-input" autocomplete="new-password">
    </div>
    <div class="field">
      <label>Επιβεβαίωση κωδικού</label>
      <input type="password" id="password-modal-confirm" autocomplete="new-password">
    </div>
    <div id="password-modal-error" style="color:var(--red); font-size:13px; display:none; margin-bottom:8px;"></div>
    <div class="modal-actions">
      <button class="btn-cancel" id="password-modal-cancel">Άκυρο</button>
      <button class="btn-small" id="password-modal-save">Αποθήκευση</button>
    </div>
  </div>
</div>

<script src="admin.js"></script>
</body>
</html>
