<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Διαχειριστικό — Μπουγάτσα Ζήσης</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

  :root {
    --cream: #EAF5E6;
    --paper: #FFFFFF;
    --ink: #1E3323;
    --ink-soft: #557157;
    --line: #CFE6C8;
    --gold: #C99A44;
    --gold-deep: #A97C33;
    --gold-tint: #F6ECD6;
    --green: #2F6B3F;
    --green-tint: #DFF0DA;
    --amber: #B87A2E;
    --amber-tint: #F5E9D3;
    --red: #A24B3F;
    --red-tint: #F3E2DE;
    --radius: 10px;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: var(--cream);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { font-family: 'Fraunces', serif; margin: 0; font-weight: 600; }

  /* ---------- Login ---------- */
  #login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .login-card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 40px 36px;
    width: 100%;
    max-width: 360px;
    box-shadow: 0 2px 24px rgba(43,36,28,0.06);
  }
  .login-mark {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: var(--gold-tint);
    color: var(--gold-deep);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 18px;
    margin-bottom: 18px;
  }
  .login-card h1 { font-size: 22px; margin-bottom: 4px; }
  .login-card p.sub { color: var(--ink-soft); font-size: 14px; margin: 0 0 24px; }
  label { display: block; font-size: 13px; color: var(--ink-soft); margin-bottom: 6px; }
  input, select {
    width: 100%;
    padding: 11px 13px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 15px;
    font-family: inherit;
    background: var(--paper);
    color: var(--ink);
  }
  input:focus, select:focus, button:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 1px;
  }
  .field { margin-bottom: 16px; }
  button {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    cursor: pointer;
    border: none;
  }
  .btn-primary {
    width: 100%;
    background: var(--gold);
    color: white;
    padding: 12px;
    border-radius: 8px;
    font-size: 15px;
    transition: background 0.15s;
  }
  .btn-primary:hover { background: var(--gold-deep); }
  .btn-primary:disabled { background: var(--line); color: var(--ink-soft); cursor: not-allowed; }
  #login-error {
    color: var(--red);
    background: var(--red-tint);
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 16px;
    display: none;
  }

  /* ---------- App shell ---------- */
  #app { display: none; min-height: 100vh; }
  .topbar {
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    padding: 0 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 64px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .mark {
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--gold-tint); color: var(--gold-deep);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Fraunces', serif; font-weight: 700; font-size: 14px;
  }
  .brand h1 { font-size: 17px; }
  .topbar-right { display: flex; align-items: center; gap: 16px; }
  .who { font-size: 13px; color: var(--ink-soft); }
  .btn-ghost {
    background: transparent;
    color: var(--ink-soft);
    border: 1px solid var(--line);
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 13px;
  }
  .btn-ghost:hover { border-color: var(--gold); color: var(--gold-deep); }

  .tabs {
    display: flex;
    gap: 4px;
    padding: 0 28px;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
  }
  .tab {
    padding: 14px 6px;
    margin-right: 22px;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink-soft);
    background: none;
    border-bottom: 2px solid transparent;
    cursor: pointer;
  }
  .tab.active { color: var(--gold-deep); border-bottom-color: var(--gold); }

  main { padding: 28px; max-width: 1080px; margin: 0 auto; }
  .view { display: none; }
  .view.active { display: block; }

  .toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; flex-wrap: wrap; gap: 10px; }
  .toolbar h2 { font-size: 20px; }
  .filter-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    padding: 7px 13px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--paper);
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .chip.active { background: var(--gold); border-color: var(--gold); color: white; }

  .order-list { display: flex; flex-direction: column; gap: 10px; }
  .order-card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 18px;
  }
  .order-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
  .order-id { font-family: 'Fraunces', serif; font-size: 16px; font-weight: 600; }
  .order-meta { font-size: 13px; color: var(--ink-soft); margin-top: 3px; }
  .status-badge {
    padding: 4px 11px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
  }
  .status-pending { background: var(--amber-tint); color: var(--amber); }
  .status-confirmed { background: var(--gold-tint); color: var(--gold-deep); }
  .status-preparing { background: var(--gold-tint); color: var(--gold-deep); }
  .status-out_for_delivery { background: #E4EAF3; color: #3D5C8C; }
  .status-delivered { background: var(--green-tint); color: var(--green); }
  .status-cancelled { background: var(--red-tint); color: var(--red); }

  .order-body { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); display: flex; gap: 24px; flex-wrap: wrap; }
  .order-items { flex: 1; min-width: 200px; font-size: 14px; }
  .order-items div { display: flex; justify-content: space-between; padding: 3px 0; color: var(--ink-soft); }
  .order-total { font-weight: 600; color: var(--ink); border-top: 1px solid var(--line); margin-top: 6px; padding-top: 6px; }
  .order-actions { display: flex; flex-direction: column; gap: 8px; min-width: 190px; }
  .order-actions select { font-size: 13px; padding: 8px 10px; }
  .link-btn { background: none; border: none; color: var(--gold-deep); font-size: 12px; text-decoration: underline; cursor: pointer; padding: 0; text-align: left; }
  .history-list { font-size: 12px; color: var(--ink-soft); margin-top: 6px; display: none; }
  .history-list.show { display: block; }
  .history-list div { padding: 2px 0; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--ink-soft); }
  .empty-state h3 { color: var(--ink); font-size: 17px; margin-bottom: 6px; }

  table { width: 100%; border-collapse: collapse; background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  th, td { padding: 12px 16px; text-align: left; font-size: 14px; border-bottom: 1px solid var(--line); }
  th { color: var(--ink-soft); font-weight: 600; font-size: 12.5px; background: var(--gold-tint); }
  tr:last-child td { border-bottom: none; }
  .price-input { width: 90px; padding: 6px 8px; font-size: 14px; }
  .avail-toggle { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 13px; }
  .avail-toggle input { width: auto; }
  .save-hint { font-size: 12px; color: var(--green); opacity: 0; transition: opacity 0.3s; margin-left: 8px; }
  .save-hint.show { opacity: 1; }

  .btn-small { padding: 7px 13px; border-radius: 7px; font-size: 13px; background: var(--gold); color: white; }
  .btn-small:hover { background: var(--gold-deep); }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(43,36,28,0.35);
    display: none; align-items: center; justify-content: center; z-index: 100;
    padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--paper); border-radius: var(--radius); padding: 28px;
    width: 100%; max-width: 380px;
  }
  .modal h3 { font-size: 18px; margin-bottom: 18px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 6px; }
  .modal-actions button { flex: 1; padding: 10px; border-radius: 8px; font-size: 14px; }
  .btn-cancel { background: var(--cream); color: var(--ink-soft); border: 1px solid var(--line); }

  @media (max-width: 640px) {
    .topbar, .tabs, main { padding-left: 16px; padding-right: 16px; }
    .order-body { flex-direction: column; }
  }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-mark">ΜΖ</div>
    <h1>Διαχειριστικό</h1>
    <p class="sub">Μπουγάτσα Ζήσης — Σέρρες</p>
    <div id="login-error"></div>
    <form id="login-form">
      <div class="field">
        <label for="username">Όνομα χρήστη</label>
        <input type="text" id="username" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Κωδικός</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-primary" id="login-btn">Είσοδος</button>
    </form>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <div class="topbar">
    <div class="brand">
      <div class="mark">ΜΖ</div>
      <h1>Διαχειριστικό — Μπουγάτσα Ζήσης</h1>
    </div>
    <div class="topbar-right">
      <span class="who" id="who-label"></span>
      <button class="btn-ghost" id="logout-btn">Αποσύνδεση</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-view="orders">Παραγγελίες</button>
    <button class="tab" data-view="products">Προϊόντα</button>
    <button class="tab" id="tab-users" data-view="users">Χρήστες</button>
  </div>

  <main>
    <!-- ORDERS -->
    <section class="view active" id="view-orders">
      <div class="toolbar">
        <h2>Παραγγελίες</h2>
        <div class="filter-row" id="status-filters"></div>
      </div>
      <div class="order-list" id="order-list"></div>
    </section>

    <!-- PRODUCTS -->
    <section class="view" id="view-products">
      <div class="toolbar"><h2>Προϊόντα</h2></div>
      <table>
        <thead><tr><th>Κατηγορία</th><th>Προϊόν</th><th>Τιμή (€)</th><th>Διαθεσιμότητα</th><th></th></tr></thead>
        <tbody id="product-rows"></tbody>
      </table>
    </section>

    <!-- USERS -->
    <section class="view" id="view-users">
      <div class="toolbar">
        <h2>Χρήστες</h2>
        <button class="btn-small" id="new-user-btn">+ Νέος χρήστης</button>
      </div>
      <table>
        <thead><tr><th>Όνομα χρήστη</th><th>Ρόλος</th><th>Κατάσταση</th><th></th></tr></thead>
        <tbody id="user-rows"></tbody>
      </table>
    </section>
  </main>
</div>

<!-- New user modal -->
<div class="modal-overlay" id="user-modal">
  <div class="modal">
    <h3>Νέος χρήστης</h3>
    <div class="field">
      <label>Όνομα χρήστη</label>
      <input type="text" id="new-username">
    </div>
    <div class="field">
      <label>Κωδικός</label>
      <input type="password" id="new-password">
    </div>
    <div class="field">
      <label>Ρόλος</label>
      <select id="new-role">
        <option value="staff">Προσωπικό</option>
        <option value="admin">Διαχειριστής</option>
      </select>
    </div>
    <div id="user-modal-error" style="color:var(--red); font-size:13px; display:none; margin-bottom:8px;"></div>
    <div class="modal-actions">
      <button class="btn-cancel" id="user-modal-cancel">Άκυρο</button>
      <button class="btn-small" id="user-modal-save">Δημιουργία</button>
    </div>
  </div>
</div>

<!-- Change password modal -->
<div class="modal-overlay" id="password-modal">
  <div class="modal">
    <h3>Αλλαγή κωδικού</h3>
    <p style="font-size:13px;color:var(--ink-soft);margin:-8px 0 14px;">Χρήστης: <strong id="password-modal-username"></strong></p>
    <div class="field">
      <label>Νέος κωδικός</label>
      <input type="password" id="password-modal-input" autocomplete="new-password">
    </div>
    <div class="field">
      <label>Επιβεβαίωση κωδικού</label>
      <input type="password" id="password-modal-confirm" autocomplete="new-password">
    </div>
    <div id="password-modal-error" style="color:var(--red); font-size:13px; display:none; margin-bottom:8px;"></div>
    <div class="modal-actions">
      <button class="btn-cancel" id="password-modal-cancel">Άκυρο</button>
      <button class="btn-small" id="password-modal-save">Αποθήκευση</button>
    </div>
  </div>
</div>

<script src="admin.js"></script>
</body>
</html>
